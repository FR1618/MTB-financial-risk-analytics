name: Validate financial dashboard

on:
  push:
    branches: [main]
  pull_request:

jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: pip install -r requirements.txt
      - name: Check syntax
        run: python -m compileall -q app.py credit_risk.py sec_live.py
      - name: Test credit quality calculations
        run: python -m unittest discover -s tests -v
